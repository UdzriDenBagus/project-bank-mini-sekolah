name: Deploy Laravel Blade to DomaiNesia

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & FTP Deploy

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, gd, zip, curl
          coverage: none

      - name: 📦 Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction --ignore-platform-reqs
          php -r "file_put_contents('vendor/laravel/framework/src/Illuminate/Support/Str.php', str_replace('\" \n\r\t\v\0\"', '\" \n\r\t\v\\\0\"', file_get_contents('vendor/laravel/framework/src/Illuminate/Support/Str.php')));"

      - name: 🟢 Setup Node.js & Compile Vite Assets
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: |
          npm ci || npm install
          npm run build

      - name: 🚀 Sync Files via FTP to DomaiNesia
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            .env
            .env.example
            *.md
            phpunit.xml
            .phpunit.result.cache
            convert_*.js
            revisi_srs/**
            scratch/**

      - name: ⚡ Trigger Database Migration di Hosting
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          TOKEN="${DEPLOY_SECRET:-skansaba_super_secret_token_12345}"
          HOST="${APP_DOMAIN:-${{ secrets.FTP_SERVER }}}"
          # Bersihkan protokol http:// atau https:// jika terlanjur ditulis
          HOST=$(echo "$HOST" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/$||')
          echo "Memanggil Webhook Migrasi ke: https://${HOST}/api/deploy-migrate-***"
          curl -sS -k "https://${HOST}/api/deploy-migrate-${TOKEN}?seed=1" || echo "Webhook terpanggil."

